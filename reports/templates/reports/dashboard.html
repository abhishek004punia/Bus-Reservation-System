{% extends "base.html" %}

{% block title %}Reports{% endblock %}

{% block content %}

<div class="container mt-4">

    <h2 class="mb-4">Reports Dashboard</h2>

    <div class="row">

        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body text-center">
                    <h5>Total Bookings</h5>
                    <h2>{{ total_bookings }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body text-center">
                    <h5>Confirmed Bookings</h5>
                    <h2>{{ confirmed_bookings }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body text-center">
                    <h5>Total Revenue</h5>
                    <h2>₹ {{ total_revenue }}</h2>
                </div>
            </div>
        </div>

    </div>

</div>

{% endblock %}
