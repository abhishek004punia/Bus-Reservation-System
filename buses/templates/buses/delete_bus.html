{% extends 'base.html' %}

{% block title %}Delete Bus{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-header bg-danger text-white">

                <h4>Delete Bus</h4>

            </div>

            <div class="card-body">

                <p>
                    Are you sure you want to delete
                    <strong>{{ bus.bus_name }}</strong>?
                </p>

                <form method="post">

                    {% csrf_token %}

                    <button class="btn btn-danger">
                        Yes, Delete
                    </button>

                    <a href="{% url 'bus_list' %}"
                       class="btn btn-secondary">
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
